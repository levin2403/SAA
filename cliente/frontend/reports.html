<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reportes — Gestor</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="reports-container">
    <div class="reports-header">
      <h2>Reportes de asistencia</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="exportCSV" class="btn">Descargar Excel</button>
        <button onclick="history.back()" class="btn outline">Volver</button>
      </div>
    </div>

    <div class="reports-filters">
      <div>
        <label for="filterClass">Materia:</label>
        <select id="filterClass">
          <option value="">Selecciona una materia</option>
        </select>
      </div>
      <div>
        <label for="filterStartDate">Desde:</label>
        <input type="date" id="filterStartDate" />
      </div>
      <div>
        <label for="filterEndDate">Hasta:</label>
        <input type="date" id="filterEndDate" />
      </div>
      <div style="display:flex;align-items:flex-end">
        <button id="searchBtn" class="btn">Buscar</button>
      </div>
    </div>

    <div class="reports-table-container">
      <table id="reportsTable" class="matrix-table">
        <thead>
          <tr id="tableHeaderRow">
            <th>Alumno / Fecha</th>
          </tr>
        </thead>
        <tbody id="reportsTableBody">
          <tr><td colspan="100" style="text-align:center;padding:20px;color:#6b7280">Selecciona una materia y rango para ver la lista.</td></tr>
        </tbody>
      </table>
    </div>

    <div id="reportsArea" style="margin-top:20px;color:#6b7280;font-size:14px;display:none">
      <p id="reportsStats"></p>
    </div>
  </div>

  <script src="screens.js"></script>
  <script>
    // --- 1. INICIALIZACIÓN Y SEGURIDAD ---
    const user = window.SCREENS.getUserFromStorage();
    if(!user || user.type !== 'teacher') window.location.href='login.html';
    
    

    // Referencias DOM
    const classes = window.SCREENS.teacherClasses;
    const filterClassSelect = document.getElementById('filterClass');
    const filterStartDate = document.getElementById('filterStartDate');
    const filterEndDate = document.getElementById('filterEndDate');
    const searchBtn = document.getElementById('searchBtn');
    const exportCSVBtn = document.getElementById('exportCSV');
    const tableHeaderRow = document.getElementById('tableHeaderRow');
    const reportsTableBody = document.getElementById('reportsTableBody');
    const reportsArea = document.getElementById('reportsArea');
    const reportsStats = document.getElementById('reportsStats');

    // --- 2. CONFIGURACIÓN DEL SEMESTRE ---
    const currentYear = new Date().getFullYear();
    const SEMESTER_START_STR = `${currentYear}-08-25`; 
    const SEMESTER_END_STR = `${currentYear}-12-13`;

    // Restringir selectores HTML
    filterStartDate.min = SEMESTER_START_STR;
    filterStartDate.max = SEMESTER_END_STR;
    filterEndDate.min = SEMESTER_START_STR;
    filterEndDate.max = SEMESTER_END_STR;

    // --- 3. CARGAR DATOS INICIALES ---
    // Llenar Materias
    classes.forEach(c => {
      const option = document.createElement('option');
      option.value = c.id;
      option.textContent = c.name;
      filterClassSelect.appendChild(option);
    });

    // Fechas por defecto inteligentes
    const today = new Date();
    const todayStr = window.SCREENS.formatDateForInput(today);
    
    if (todayStr < SEMESTER_START_STR) {
        filterStartDate.value = SEMESTER_START_STR;
        filterEndDate.value = SEMESTER_START_STR;
    } else if (todayStr > SEMESTER_END_STR) {
        filterEndDate.value = SEMESTER_END_STR;
        const d = window.SCREENS.parseLocalYMD(SEMESTER_END_STR);
        d.setDate(d.getDate() - 30);
        filterStartDate.value = window.SCREENS.formatDateForInput(d);
    } else {
        filterEndDate.value = todayStr;
        const d = window.SCREENS.parseLocalYMD(todayStr);
        d.setDate(d.getDate() - 30);
        const dStr = window.SCREENS.formatDateForInput(d);
        filterStartDate.value = (dStr < SEMESTER_START_STR) ? SEMESTER_START_STR : dStr;
    }

    // --- 4. LÓGICA DE PROCESAMIENTO DE DATOS (MATRIZ) ---
    function getReportData() {
      const sVal = filterStartDate.value;
      const eVal = filterEndDate.value;
      const classId = filterClassSelect.value ? Number(filterClassSelect.value) : null;

      if (!sVal || !eVal) { alert("Selecciona las fechas."); return null; }
      if (!classId) { alert("Selecciona una materia."); return null; }

      const start = window.SCREENS.parseLocalYMD(sVal);
      const end = window.SCREENS.parseLocalYMD(eVal);

      if (start > end) { alert("La fecha de inicio es mayor a la final."); return null; }

      // Validar 31 días
      const diffDays = Math.ceil(Math.abs(end - start) / (1000 * 60 * 60 * 24)) + 1;
      if (diffDays > 31) {
        alert(`Has seleccionado ${diffDays} días. El máximo permitido es 31.`);
        return null;
      }

      // Obtener registros crudos
      const records = window.SCREENS.getAttendanceRecordsByDateRange(sVal, eVal, classId);
      
      if (records.length === 0) return { empty: true };

      // 1. Columnas (Fechas)
      const dateSet = new Set();
      const dateObjMap = {}; 
      
      records.forEach(r => {
        const dStr = window.SCREENS.formatDateForInput(new Date(r.date));
        dateSet.add(dStr);
        dateObjMap[dStr] = new Date(r.date);
      });
      const sortedDates = Array.from(dateSet).sort();

      // 2. Filas (Alumnos)
      const studentsMap = new Map();

      records.forEach(r => {
        const dStr = window.SCREENS.formatDateForInput(new Date(r.date));
        r.records.forEach(s => {
          const sId = s.student.id || s.studentId || 'S/ID';
          const sName = s.student.name || s.studentName || 'Desconocido';
          
          if (!studentsMap.has(sId)) {
            studentsMap.set(sId, { id: sId, name: sName, attendance: {} });
          }
          // Marcar asistencia
          const studentEntry = studentsMap.get(sId);
          studentEntry.attendance[dStr] = s.present ? 'X' : 'F';
        });
      });

      const studentsArray = Array.from(studentsMap.values()).sort((a, b) => a.name.localeCompare(b.name));

      return { empty: false, dates: sortedDates, students: studentsArray, dateObjs: dateObjMap };
    }

    // --- 5. GENERAR TABLA HTML ---
    function generateReport() {
      const data = getReportData();
      if (!data) return; 

      if (data.empty) {
        tableHeaderRow.innerHTML = '<th>Estado</th>';
        reportsTableBody.innerHTML = '<tr><td style="text-align:center;padding:20px;">No se encontraron registros.</td></tr>';
        reportsArea.style.display = 'none';
        return;
      }

      let headerHTML = '<th style="min-width:200px; text-align:left;">Alumno</th>';
      data.dates.forEach(dStr => {
        const datePretty = data.dateObjs[dStr].toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
        headerHTML += `<th>${datePretty}</th>`;
      });
      headerHTML += '<th>% Asist.</th>';
      tableHeaderRow.innerHTML = headerHTML;

      reportsTableBody.innerHTML = '';
      
      data.students.forEach(st => {
        const tr = document.createElement('tr');
        let rowHTML = `<td><strong>${st.name}</strong><br><small style="color:#9ca3af">${st.id}</small></td>`;
        
        let presentCount = 0;
        let totalRegisteredDays = 0;

        data.dates.forEach(dStr => {
          const status = st.attendance[dStr]; 
          let cellContent = '-';
          let cellClass = '';

          if (status === 'X') {
            cellContent = 'X'; 
            cellClass = 'status-present';
            presentCount++;
            totalRegisteredDays++;
          } else if (status === 'F') {
            cellContent = 'F'; 
            cellClass = 'status-absent';
            totalRegisteredDays++;
          }
          rowHTML += `<td class="${cellClass}">${cellContent}</td>`;
        });

        const percent = totalRegisteredDays > 0 ? Math.round((presentCount / totalRegisteredDays) * 100) : 0;
        rowHTML += `<td><strong>${percent}%</strong></td>`;

        tr.innerHTML = rowHTML;
        reportsTableBody.appendChild(tr);
      });

      reportsStats.innerHTML = `Mostrando historial de <strong>${data.students.length}</strong> alumnos en <strong>${data.dates.length}</strong> sesiones.`;
      reportsArea.style.display = 'block';
    }

    // --- 6. GENERAR CSV (EXCEL) ---
    exportCSVBtn.addEventListener('click', () => {
      const data = getReportData();
      if (!data || data.empty) {
        alert("No hay datos para exportar.");
        return;
      }

      const className = filterClassSelect.options[filterClassSelect.selectedIndex].text;
      const rows = [];

      rows.push(['LISTA DE ASISTENCIA - SAA']);
      rows.push(['Materia:', className]);
      rows.push(['Desde:', filterStartDate.value, 'Hasta:', filterEndDate.value]);
      rows.push(['Generado el:', new Date().toLocaleString()]);
      rows.push([]); 

      const headerRow = ['ID Alumno', 'Nombre Completo'];
      data.dates.forEach(dStr => {
        const datePretty = data.dateObjs[dStr].toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit' });
        headerRow.push(datePretty);
      });
      headerRow.push('Asistencias', 'Faltas', '% Final');
      rows.push(headerRow);

      data.students.forEach(st => {
        const row = [st.id, st.name];
        let p = 0;
        let f = 0;

        data.dates.forEach(dStr => {
          const status = st.attendance[dStr];
          if (status === 'X') { row.push('X'); p++; }
          else if (status === 'F') { row.push('F'); f++; }
          else { row.push('-'); }
        });

        const total = p + f;
        const percent = total > 0 ? Math.round((p/total)*100) + '%' : '0%';
        row.push(p, f, percent);
        rows.push(row);
      });

      const cleanName = className.replace(/[^a-z0-9]/gi, '_');
      window.SCREENS.exportCSV(rows, `Lista_${cleanName}_${filterStartDate.value}.csv`);
    });

    searchBtn.addEventListener('click', generateReport);
  </script>
</body>
</html>
