a<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toma de lista — Gestor</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  <div class="attendance-container">
    <div class="attendance-header">
      <div>
        <button onclick="history.back()" class="btn outline">Volver</button>
        <h2 id="attendanceTitle" style="margin-top:12px">Toma de lista</h2>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="toggleQR" class="btn">Leer QR</button>
        <button id="toReports" class="btn outline">Ver reportes</button>
      </div>
    </div>

    <div class="attendance-info">
      <div><strong>Materia:</strong><span id="classNameInfo"></span></div>
      <div><strong>Código:</strong><span id="classCodeInfo"></span></div>
      <div><strong>Fecha:</strong><input type="date" id="attendanceDate" /></div>
      <div><strong>Horario:</strong><span id="classScheduleInfo"></span></div>
    </div>

    <div id="qrSection" class="qr-section hidden">
      <h3>Lector de Código QR</h3>
      <div class="qr-reader-container">
        <div id="qr-reader"></div>
      </div>
      <p id="qrStatus" style="color:#6b7280;font-size:12px;margin-top:8px">Estado: Escaneando...</p>
      <button id="closeQRReader" class="btn secondary" style="margin-top:12px;display:none">Cerrar lector QR</button>
    </div>

    <h3 style="margin-top:20px;margin-bottom:12px">Lista de asistencia</h3>
    <div class="attendance-students" id="attendanceStudents"></div>

    <div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap">
      <button id="saveAttendance" class="btn">Guardar asistencia</button>
      <button id="selectAll" class="btn secondary">Marcar todos</button>
      <button id="deselectAll" class="btn secondary">Desmarcar todos</button>
    </div>
  </div>

  <script src="screens.js"></script>
  <script>
    const user = window.SCREENS.getUserFromStorage()
    if(!user || user.type !== 'teacher') window.location.href='login.html'

    const params = new URLSearchParams(location.search)
    const classId = Number(params.get('classId') || '')
    const classes = window.SCREENS.teacherClasses
    const cls = classes.find(x=>x.id===classId) || classes[0]

    // Set initial date
    const today = new Date()
    document.getElementById('attendanceDate').value = window.SCREENS.formatDateForInput(today)

    document.getElementById('attendanceTitle').textContent = `Toma de lista — ${cls.name}`
    document.getElementById('classNameInfo').textContent = cls.name
    document.getElementById('classCodeInfo').textContent = cls.code
    document.getElementById('classScheduleInfo').textContent = cls.schedule

    let qrReaderActive = false
    let qrScanner = null

    function render(){
      const container = document.getElementById('attendanceStudents')
      container.innerHTML = (cls.studentsList||[]).map((s,i)=>`
        <div class="student-item">
          <span>${s}</span>
          <label>
            <input type="checkbox" data-idx="${i}" class="student-checkbox" checked /> 
            Presente
          </label>
        </div>
      `).join('')
    }
    render()

    // QR Reader Toggle
    const toggleQRBtn = document.getElementById('toggleQR')
    const qrSection = document.getElementById('qrSection')
    const closeQRBtn = document.getElementById('closeQRReader')

    toggleQRBtn.addEventListener('click', ()=>{
      if(!qrReaderActive){
        startQRReader()
      } else {
        stopQRReader()
      }
    })

    closeQRBtn.addEventListener('click', ()=>{
      stopQRReader()
    })

    function startQRReader(){
      qrReaderActive = true
      qrSection.classList.remove('hidden')
      closeQRBtn.style.display = 'block'
      toggleQRBtn.textContent = 'Cerrar lector QR'

      const config = {
        fps: 10,
        qrbox: {width: 250, height: 250},
        rememberLastUsedCamera: true
      }

      Html5Qrcode.getCameras().then(devices => {
        if(devices && devices.length){
          const cameraId = devices[0].id
          qrScanner = new Html5Qrcode("qr-reader")
          qrScanner.start(cameraId, config, onScanSuccess, onScanError).catch(err => {
            document.getElementById('qrStatus').textContent = 'Error: No se pudo acceder a la cámara. ' + err
          })
        } else {
          document.getElementById('qrStatus').textContent = 'Error: No hay cámara disponible'
        }
      }).catch(err => {
        document.getElementById('qrStatus').textContent = 'Error: ' + err
      })
    }

    function stopQRReader(){
      qrReaderActive = false
      if(qrScanner){
        qrScanner.stop().then(() => {
          qrScanner = null
          qrSection.classList.add('hidden')
          closeQRBtn.style.display = 'none'
          toggleQRBtn.textContent = 'Leer QR'
          document.getElementById('qrStatus').textContent = 'Estado: Escaneando...'
        }).catch(err => {
          console.error('Error stopping QR scanner:', err)
        })
      }
    }

    function onScanSuccess(decodedText, decodedResult){
      // Aquí iría la lógica de mapear IDs de estudiantes desde QR
      // Por ahora, marcamos como presente si el texto contiene "PRESENT"
      if(decodedText.includes('PRESENT')){
        document.querySelectorAll('.student-checkbox').forEach(cb => cb.checked = true)
        document.getElementById('qrStatus').textContent = 'Status: Estudiante marcado como presente'
      }
    }

    function onScanError(error){
      // Ignoramos errores de lectura (cuando no hay QR visible)
      // Se puede loguear en la consola si es necesario
    }

    document.getElementById('saveAttendance').addEventListener('click', ()=>{
      const checkboxes = Array.from(document.querySelectorAll('#attendanceStudents input[type=checkbox]'))
      const date = document.getElementById('attendanceDate').value
      const records = checkboxes.map((cb,i)=>({ student: cls.studentsList[i], present: !!cb.checked }))
      const rec = { id: Date.now(), classId: cls.id, className: cls.name, date: new Date(date).toLocaleString(), records }
      const arr = window.SCREENS.getStoredRecords(); arr.unshift(rec); window.SCREENS.persistStoredRecords(arr)
      
      stopQRReader()
      alert('Asistencia guardada')
      window.location.href = 'attendance.html?classId=' + classId
    })

    document.getElementById('toReports').addEventListener('click', ()=> {
      stopQRReader()
      window.location.href='reports.html'
    })

    document.getElementById('selectAll').addEventListener('click', ()=>{
      document.querySelectorAll('.student-checkbox').forEach(cb => cb.checked = true)
    })

    document.getElementById('deselectAll').addEventListener('click', ()=>{
      document.querySelectorAll('.student-checkbox').forEach(cb => cb.checked = false)
    })
  </script>
</body>
</html>
